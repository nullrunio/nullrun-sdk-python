name: publish-test

on:
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Point uv at the interpreter setup-python installed
        run: echo "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run --frozen --extra dev pytest tests/ -v -n auto

  publish:
    name: Build and publish to TestPyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nullrun
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Point uv at the interpreter setup-python installed
        run: echo "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

      # This job holds the TestPyPI Trusted Publishing token, so the
      # supply-chain check runs here, before the build and the upload.
      - name: Check the action pins and the lock-based installs
        run: python scripts/check_supply_chain.py

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Build
        # ``build`` and ``twine`` come from the ``publish`` dependency
        # group in uv.lock, not from a run-time pip resolution.
        run: uv run --frozen --only-group publish python -m build

      - name: Check dist
        run: uv run --frozen --only-group publish twine check dist/*

      - name: Publish to TestPyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI rejects re-uploads of the same wheel hash with
          # HTTP 400 "File already exists". `skip-existing` makes
          # re-runs of the same SHA a no-op (matching twine's
          # --skip-existing behaviour). Production PyPI cannot
          # overwrite anyway, so this flag is harmless there too.
          skip-existing: true
