repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]

  # Project rule, not a third-party check. Lives here rather than in
  # .git/hooks so it is versioned, shared, and runs in CI — a hook installed
  # only on one machine is the same convention that already failed twice.
  - repo: local
    hooks:
      - id: reject-coauthored-trailer
        name: reject Co-Authored-By trailer
        entry: scripts/reject_coauthor_trailer.sh
        language: script
        stages: [commit-msg]
        always_run: true